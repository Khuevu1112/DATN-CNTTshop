<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Xác nhận OTP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0; padding:0; height:100vh;
    display:flex; justify-content:center; align-items:center;
    background:linear-gradient(135deg,#ff6a00,#ff007f);
    font-family:Arial,sans-serif;
}
.forgot-box{
    width:100%; max-width:520px; background:white;
    padding:40px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,.2);
}
.title{ text-align:center; font-size:32px; font-weight:700; margin-bottom:8px; }
.form-control{ height:55px; border-radius:8px; font-size:18px; }
.btn-reset{
    height:55px; border:none; border-radius:8px; font-size:18px; font-weight:600;
    color:white; background:linear-gradient(to right,#8e2de2,#4facfe);
}
.btn-reset:hover{ opacity:.9; }
</style>
</head>
<body>

<div class="forgot-box">
    <h2 class="title">Nhập mã xác nhận</h2>
    <p class="text-center text-muted">Mã OTP đã được gửi tới <b th:text="${email}"></b> (hiệu lực 5 phút).</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/DustNovel/verify-otp}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <div class="mb-3">
            <input type="text" name="otp" class="form-control text-center"
                   placeholder="Nhập mã 6 số" maxlength="6" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn-reset">Xác nhận</button>
        </div>
    </form>
</div>

</body>
</html>
