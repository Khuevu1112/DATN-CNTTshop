<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Đặt lại mật khẩu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    margin:0; padding:0; height:100vh;
    display:flex; justify-content:center; align-items:center;
    background:linear-gradient(135deg,#ff6a00,#ff007f);
    font-family:Arial,sans-serif;
}
.forgot-box{
    width:100%; max-width:520px; background:white;
    padding:40px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,.2);
}
.title{ text-align:center; font-size:32px; font-weight:700; margin-bottom:20px; }
.form-control{ height:55px; border-radius:8px; font-size:18px; }
.password-box{ position:relative; }
.password-box i{
    position:absolute; top:50%; right:20px; transform:translateY(-50%);
    cursor:pointer; font-size:22px; color:#666;
}
.btn-reset{
    height:55px; border:none; border-radius:8px; font-size:18px; font-weight:600;
    color:white; background:linear-gradient(to right,#8e2de2,#4facfe);
}
.btn-reset:hover{ opacity:.9; }
</style>
</head>
<body>

<div class="forgot-box">
    <h2 class="title">Đặt lại mật khẩu</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/DustNovel/reset-password}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <input type="hidden" name="otp" th:value="${otp}">

        <div class="mb-3 password-box">
            <input type="password" id="newPassword" name="matKhauMoi" class="form-control"
                   placeholder="Mật khẩu mới" required>
            <i class="bi bi-eye" onclick="togglePassword('newPassword', this)"></i>
        </div>

        <div class="mb-4 password-box">
            <input type="password" id="confirmPassword" name="nhapLaiMatKhau" class="form-control"
                   placeholder="Nhập lại mật khẩu mới" required>
            <i class="bi bi-eye" onclick="togglePassword('confirmPassword', this)"></i>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn-reset">Đổi mật khẩu</button>
        </div>
    </form>
</div>

<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye"); icon.classList.add("bi-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash"); icon.classList.add("bi-eye");
    }
}
</script>

</body>
</html>
