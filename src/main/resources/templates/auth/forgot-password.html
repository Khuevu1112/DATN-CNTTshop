<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Quên mật khẩu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>
body{
    margin:0; padding:0; height:100vh;
    display:flex; justify-content:center; align-items:center;
    background:linear-gradient(135deg,#ff6a00,#ff007f);
    font-family:Arial,sans-serif;
}
.forgot-box{
    width:100%; max-width:520px; background:white;
    padding:40px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,.2);
}
.title{ text-align:center; font-size:32px; font-weight:700; margin-bottom:20px; }
.form-control{ height:55px; border-radius:8px; font-size:18px; }
.btn-reset{
    height:55px; border:none; border-radius:8px; font-size:18px; font-weight:600;
    color:white; background:linear-gradient(to right,#8e2de2,#4facfe);
}
.btn-reset:hover{ opacity:.9; }
.login-link{ text-align:center; margin-top:20px; }
.login-link a{ text-decoration:none; color:#00c896; font-weight:600; }
</style>
</head>
<body>

<div class="forgot-box">
    <h2 class="title">Quên mật khẩu</h2>
    <p class="text-center text-muted">Nhập email đã đăng ký, chúng tôi sẽ gửi mã xác nhận (OTP).</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/DustNovel/forgot-password}" method="post">
        <div class="mb-3">
            <input type="email" name="email" class="form-control"
                   placeholder="Nhập email tài khoản" th:value="${email}" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn-reset">Gửi mã xác nhận</button>
        </div>
    </form>

    <div class="login-link">
        Quay lại ? <a th:href="@{/DustNovel/login}">Đăng nhập</a>
    </div>
</div>

</body>
</html>
