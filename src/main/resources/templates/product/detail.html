<div xmlns:th="http://www.thymeleaf.org" class="bg-white p-4 rounded shadow-sm">

    <div class="row">

        <!-- ẢNH SẢN PHẨM -->
        <div class="col-lg-6">
            <img th:if="${product.images != null and !product.images.isEmpty()}"
                 th:src="${product.images[0].url}"
                 class="img-fluid border rounded"
                 style="width:100%; height:420px; object-fit:contain; padding:20px;">
            <img th:if="${product.images == null or product.images.isEmpty()}"
                 src="https://via.placeholder.com/500x500?text=CNTTShop"
                 class="img-fluid border rounded"
                 style="width:100%; height:420px; object-fit:contain; padding:20px;">
            <div class="d-flex gap-2 mt-3"
                 th:if="${product.images != null and !product.images.isEmpty()}">
                <img th:each="img : ${product.images}"
                     th:src="${img.url}"
                     class="border rounded"
                     style="width:80px; height:80px; object-fit:contain; padding:5px;">
            </div>
        </div>

        <!-- THÔNG TIN SẢN PHẨM -->
        <div class="col-lg-6">

            <h2 class="fw-bold" th:text="${product.name}">Tên sản phẩm</h2>

            <p class="text-muted">
                SKU:
                <span th:if="${product.variants != null and !product.variants.isEmpty()}"
                      th:text="${product.variants[0].sku}"></span>
            </p>

            <hr>

            <!-- GIÁ -->
            <!-- Giá do JS điền theo biến thể đang chọn (xem updatePrice ở cuối trang); render
                 sẵn giá của biến thể đầu tiên để không nháy trống trước khi script chạy. -->
            <h1 id="productPrice"
                class="fw-bold"
                style="color:#032e5d;"
                th:if="${product.variants != null and !product.variants.isEmpty()}"
                th:text="${#numbers.formatDecimal(product.variants[0].price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
            </h1>
            <div class="text-muted text-decoration-line-through fs-5"
                 th:if="${product.variants != null
                         and !product.variants.isEmpty()
                         and product.variants[0].originalPrice != null}"
                 th:text="${#numbers.formatDecimal(product.variants[0].originalPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
            </div>
            <h3 class="text-muted"
                th:if="${product.variants == null or product.variants.isEmpty()}">
                Chưa có giá
            </h3>

            <!-- BANNER KHUYẾN MÃI -->
            <div class="mb-4">
                <div class="alert alert-info mb-0">
                    <strong>🎁 Bạn sẽ nhận được</strong>
                    <ul class="mb-0 mt-2">
                        <li>Mã giảm thêm 200.000đ cho đơn từ 500.000đ.</li>
                        <li>Ưu đãi phụ kiện, phần mềm, bảo hành tùy sản phẩm.</li>
                    </ul>
                </div>
            </div>

            <!-- FORM GIỎ HÀNG / MUA NGAY -->
            <form th:action="@{/cart/add}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">
                <div class="mb-3"
                     th:if="${product.variants != null and !product.variants.isEmpty()}">

                    <label class="form-label fw-bold">
                        Chọn phiên bản
                    </label>

                    <select class="form-select"
                            id="variantSelect"
                            name="variantId">

                    <option
                        th:each="v : ${product.variants}"
                        th:value="${v.id}"
                        th:data-price="${v.price}"
                        th:text="${v.sku}">
                    </option>

                    </select>

                </div>

                <!-- GHI CHÚ -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Ghi chú quà tặng / yêu cầu khác</label>
                    <textarea name="note" class="form-control" rows="3"
                              placeholder="Nhập yêu cầu của bạn tại đây..."></textarea>
                </div>

                <!-- SỐ LƯỢNG -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Số lượng</label>
                    <div class="input-group" style="width:160px;">
                        <button type="button" class="btn btn-outline-secondary" onclick="changeQty(-1)">-</button>
                        <input type="number" id="quantity" name="quantity"
                               class="form-control text-center" value="1" min="1">
                        <button type="button" class="btn btn-outline-secondary" onclick="changeQty(1)">+</button>
                    </div>
                </div>

                <!-- NÚT HÀNH ĐỘNG -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <button type="submit" class="btn btn-outline-danger btn-lg w-100 fw-bold">
                            <i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ hàng
                        </button>
                    </div>
                    <div class="col-md-6">
                        <button type="submit" formaction="/cart/add?redirect=checkout"
                                class="btn btn-danger btn-lg w-100 fw-bold">
                            Mua ngay
                        </button>
                    </div>
                </div>
            </form>

            <!-- NÚT SO SÁNH (thêm mới) -->
            <div class="mt-3">
                <button type="button" id="btnAddCompare"
                        th:data-id="${product.id}"
                        th:data-name="${product.name}"
                        onclick="addToCompare(this)"
                        style="background:transparent;border:2px solid #032e5d;color:#032e5d;
                               padding:10px 22px;border-radius:8px;font-size:14px;font-weight:700;
                               font-family:Arial,sans-serif;cursor:pointer;width:100%;
                               display:flex;align-items:center;justify-content:center;gap:8px;
                               transition:all .2s;">
                    <i class="bi bi-bar-chart-steps"></i>
                    Thêm vào so sánh
                </button>
            </div>

        </div>
    </div>

    <!-- MÔ TẢ -->
    <div class="mt-5 border rounded p-4 bg-light">
        <h4 class="text-danger fw-bold">Mô tả sản phẩm</h4>
        <p th:text="${product.description}">Mô tả sản phẩm</p>
    </div>

    <!-- THÔNG SỐ -->
    <div class="mt-4">
        <h4 class="fw-bold">Thông số kỹ thuật</h4>
        <table class="table table-bordered mt-3"
               th:if="${product.specs != null and !product.specs.isEmpty()}">
            <tr th:each="s : ${product.specs}">
                <th th:text="${s.specKey}" style="width:30%;background:#f8fafc;">Thông số</th>
                <td th:text="${s.specValue}">Giá trị</td>
            </tr>
        </table>
        <div th:if="${product.specs == null or product.specs.isEmpty()}"
             class="alert alert-secondary">
            Chưa có thông số kỹ thuật.
        </div>
    </div>

</div>

<!-- Thanh so sánh nổi ở dưới -->
<div id="compareBar"
     style="display:none;position:fixed;bottom:0;left:0;right:0;
            background:#081a2d;color:white;padding:14px 24px;z-index:9999;
            box-shadow:0 -4px 20px rgba(0,0,0,.3);">
  <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span style="font-size:14px;font-weight:700;opacity:.8;">So sánh:</span>
      <div id="compareList" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button onclick="clearCompare()"
              style="background:transparent;border:1.5px solid rgba(255,255,255,.4);color:white;
                     padding:8px 16px;border-radius:8px;font-size:13px;font-family:Arial,sans-serif;cursor:pointer;">
        Xóa tất cả
      </button>
      <a id="compareGoBtn" href="#"
         style="background:#032e5d;color:white;padding:10px 24px;border-radius:8px;
                font-size:14px;font-weight:700;text-decoration:none;
                border:2px solid rgba(255,255,255,.2);">
        <i class="bi bi-bar-chart-steps me-2"></i>So sánh ngay
      </a>
    </div>
  </div>
</div>

<script>
function changeQty(value) {
    const input = document.getElementById("quantity");
    let qty = parseInt(input.value) + value;
    if (qty < 1) qty = 1;
    input.value = qty;
}

const variantSelect = document.getElementById("variantSelect");
const priceBox = document.getElementById("productPrice");

function updatePrice(){

    if(!variantSelect) return;

    const option = variantSelect.options[variantSelect.selectedIndex];

    let price = option.dataset.price;

    price = Number(price).toLocaleString("vi-VN");

    priceBox.innerHTML = price + " ₫";
}

if(variantSelect){

    variantSelect.addEventListener("change", updatePrice);

    updatePrice();

}

// So sánh: lưu vào sessionStorage
const MAX_COMPARE = 4;

function getCompareList() {
    return JSON.parse(sessionStorage.getItem('compareList') || '[]');
}
function saveCompareList(list) {
    sessionStorage.setItem('compareList', JSON.stringify(list));
}

function addToCompare(btn) {
    const id   = parseInt(btn.dataset.id);
    const name = btn.dataset.name;
    let list   = getCompareList();

    if (list.find(function(s){ return s.id === id; })) {
        list = list.filter(function(s){ return s.id !== id; });
        saveCompareList(list);
        renderCompareBar();
        btn.innerHTML = '<i class="bi bi-bar-chart-steps"></i> Thêm vào so sánh';
        btn.style.background = 'transparent';
        btn.style.color = '#032e5d';
        return;
    }
    if (list.length >= MAX_COMPARE) {
        alert('Chỉ được so sánh tối đa ' + MAX_COMPARE + ' sản phẩm!');
        return;
    }
    list.push({ id: id, name: name });
    saveCompareList(list);
    renderCompareBar();
    btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Đã thêm vào so sánh';
    btn.style.background = '#032e5d';
    btn.style.color = 'white';
}

function clearCompare() {
    saveCompareList([]);
    renderCompareBar();
    const btn = document.getElementById('btnAddCompare');
    if (btn) {
        btn.innerHTML = '<i class="bi bi-bar-chart-steps"></i> Thêm vào so sánh';
        btn.style.background = 'transparent';
        btn.style.color = '#032e5d';
    }
}

function renderCompareBar() {
    const list = getCompareList();
    const bar  = document.getElementById('compareBar');
    const listEl = document.getElementById('compareList');
    const goBtn  = document.getElementById('compareGoBtn');

    if (list.length === 0) {
        bar.style.display = 'none';
        return;
    }
    bar.style.display = 'block';
    listEl.innerHTML = list.map(function(s) {
        return '<span style="background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;font-size:13px;">'
             + s.name + '</span>';
    }).join('');
    const ids = list.map(function(s){ return s.id; }).join('&ids=');
    goBtn.href = '/compare?ids=' + ids;
}

// Khi load trang: kiểm tra sản phẩm này đã có trong compare chưa
(function(){
    renderCompareBar();
    const btn = document.getElementById('btnAddCompare');
    if (!btn) return;
    const id = parseInt(btn.dataset.id);
    const list = getCompareList();
    if (list.find(function(s){ return s.id === id; })) {
        btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Đã thêm vào so sánh';
        btn.style.background = '#032e5d';
        btn.style.color = 'white';
    }
})();
</script>
