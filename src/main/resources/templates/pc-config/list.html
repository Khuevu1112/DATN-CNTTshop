<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<div th:fragment="content">

<style>
  * { font-family: Arial, sans-serif; }

  .pc-hero {
    background: linear-gradient(135deg, #081a2d 0%, #032e5d 100%);
    border-radius: 16px;
    padding: 40px 36px;
    color: white;
    margin-bottom: 32px;
  }
  .pc-hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .pc-hero p  { font-size: 15px; opacity: .8; margin: 0; }

  .btn-primary-custom {
    background: #032e5d;
    border: none;
    color: white;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: background .2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary-custom:hover { background: #081a2d; color: white; }

  .btn-outline-custom {
    background: transparent;
    border: 2px solid #032e5d;
    color: #032e5d;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: all .2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-outline-custom:hover { background: #032e5d; color: white; }

  .build-card {
    border: 1.5px solid #e2e8f0;
    border-radius: 14px;
    padding: 24px;
    background: white;
    transition: box-shadow .2s, border-color .2s;
    height: 100%;
  }
  .build-card:hover {
    box-shadow: 0 6px 24px rgba(3,46,93,.12);
    border-color: #032e5d;
  }

  .build-card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .build-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #081a2d, #032e5d);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 22px; flex-shrink: 0;
  }
  .build-title {
    font-size: 17px;
    font-weight: 700;
    color: #081a2d;
    margin: 0 0 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }
  .build-date { font-size: 12px; color: #94a3b8; }

  .linh-kien-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #f0f4ff;
    color: #032e5d;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    margin: 3px 3px 3px 0;
  }

  .tong-gia {
    font-size: 20px;
    font-weight: 700;
    color: #032e5d;
    margin: 16px 0 0;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #94a3b8;
  }
  .empty-state .icon { font-size: 64px; margin-bottom: 16px; color: #cbd5e1; }
  .empty-state h3 { font-size: 20px; font-weight: 700; color: #475569; margin-bottom: 8px; }

  .alert-success-custom {
    background: #f0fdf4; border: 1.5px solid #86efac;
    color: #166534; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px;
  }
  .alert-error-custom {
    background: #fef2f2; border: 1.5px solid #fca5a5;
    color: #991b1b; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px;
  }

  .badge-items {
    background: #e8f0fe;
    color: #032e5d;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
</style>

<!-- Hero -->
<div class="pc-hero">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div>
      <h1><i class="bi bi-cpu me-2"></i>Xây dựng cấu hình PC</h1>
      <p>Tự chọn linh kiện, kiểm tra tương thích và đặt hàng ngay trong vài bước</p>
    </div>
    <form th:action="@{/pc-config/tao-moi}" method="post">
      <button type="submit" class="btn-primary-custom" style="background:white;color:#032e5d;">
        <i class="bi bi-plus-lg"></i> Tạo cấu hình mới
      </button>
    </form>
  </div>
</div>

<!-- Flash messages -->
<div th:if="${success}" class="alert-success-custom">
  <i class="bi bi-check-circle me-2"></i>
  <span th:text="${success}"></span>
</div>
<div th:if="${error}" class="alert-error-custom">
  <i class="bi bi-exclamation-circle me-2"></i>
  <span th:text="${error}"></span>
</div>

<!-- Danh sách cấu hình -->
<div th:if="${builds != null and !builds.isEmpty()}">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 style="color:#081a2d;font-weight:700;margin:0;">
      Cấu hình đã lưu
      <span class="badge-items ms-2" th:text="${builds.size()}"></span>
    </h5>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" th:each="build : ${builds}">
      <div class="build-card">

        <div class="build-card-header">
          <div class="build-icon"><i class="bi bi-cpu-fill"></i></div>
          <div style="min-width:0;">
            <div class="build-title" th:text="${build.tenCauHinh}">Cấu hình Gaming</div>
            <div class="build-date">
              <i class="bi bi-clock me-1"></i>
              <span th:text="${#temporals.format(build.createdAt,'dd/MM/yyyy')}"></span>
            </div>
          </div>
          <span class="badge-items ms-auto" th:text="${build.items.size()} + ' linh kiện'"></span>
        </div>

        <!-- Chip linh kiện đã có -->
        <div th:if="${!build.items.isEmpty()}">
          <span class="linh-kien-chip" th:each="item : ${build.items}">
            <i class="bi bi-check-circle-fill" style="font-size:10px;color:#22c55e;"></i>
            <span th:text="${item.tenLoai}"></span>
          </span>
        </div>
        <div th:if="${build.items.isEmpty()}" style="color:#94a3b8;font-size:13px;">
          <i class="bi bi-info-circle me-1"></i> Chưa có linh kiện nào
        </div>

        <!-- Tổng giá -->
        <div class="tong-gia">
          <span th:text="${#numbers.formatDecimal(build.tongGia, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
        </div>

        <!-- Nút hành động -->
        <div class="d-flex gap-2 mt-3 flex-wrap">
          <a th:href="@{/pc-config/chi-tiet/{id}(id=${build.id})}"
             class="btn-primary-custom" style="padding:8px 16px;font-size:13px;">
            <i class="bi bi-eye"></i> Xem
          </a>
          <a th:href="@{/pc-config/builder/{id}(id=${build.id})}"
             class="btn-outline-custom" style="padding:8px 16px;font-size:13px;">
            <i class="bi bi-pencil"></i> Chỉnh sửa
          </a>
          <form th:action="@{/pc-config/xoa/{id}(id=${build.id})}" method="post"
                onsubmit="return confirm('Xóa cấu hình này?')" class="ms-auto">
            <button type="submit" class="btn btn-sm btn-outline-danger"
                    style="border-radius:8px;font-family:Arial,sans-serif;">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Empty state -->
<div th:if="${builds == null or builds.isEmpty()}" class="empty-state">
  <div class="icon"><i class="bi bi-cpu"></i></div>
  <h3>Chưa có cấu hình nào</h3>
  <p>Bắt đầu xây dựng cấu hình PC đầu tiên của bạn ngay!</p>
  <form th:action="@{/pc-config/tao-moi}" method="post" class="mt-3">
    <button type="submit" class="btn-primary-custom">
      <i class="bi bi-plus-lg"></i> Tạo cấu hình ngay
    </button>
  </form>
</div>

</div>
</html>
