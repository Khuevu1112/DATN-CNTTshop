<!--
  order/checkout.html
  Thêm 2 nút Sửa / Xoá cho từng địa chỉ ngay trong danh sách chọn địa chỉ khi checkout.

  LƯU Ý QUAN TRỌNG:
  - Toàn bộ danh sách địa chỉ đang nằm bên trong <form th:action="@{/orders/place}">
    (form đặt hàng chính). HTML không cho phép đặt <form> lồng trong <form> khác,
    nên nút "Xoá" KHÔNG thể dùng <form method="post"> như ở address-list.html.
    Giải pháp: dùng JS (fetch) gọi POST tới endpoint xoá có sẵn, rồi reload lại trang.
  - Nút "Sửa" chỉ là <a> bình thường nên không bị ảnh hưởng, dùng lại đúng route
    /account/addresses/{id}/edit đã có sẵn, kèm returnUrl để sửa xong quay lại đúng
    trang checkout.
  - Nếu project có bật Spring Security CSRF (mặc định OFF trong SecurityConfig hiện tại
    của bạn, vì address-list.html cũ cũng không có input CSRF), đoạn fetch bên dưới sẽ
    chạy bình thường. Nếu sau này bạn BẬT CSRF, cần thêm header
    "X-CSRF-TOKEN" lấy từ thẻ <meta name="_csrf"> vào fetch bên dưới.
-->
<div class="bg-white p-4 rounded shadow-sm">
    <h4 class="fw-bold mb-4">
        <i class="bi bi-credit-card me-2 text-danger"></i>Xác nhận đặt hàng
    </h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/orders/place}" method="post">
        <div class="row g-4">
            <div class="col-md-7">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">Chọn địa chỉ giao hàng</div>
                    <div class="card-body">

                        <div th:if="${addresses.isEmpty()}" class="text-center py-3">
                            <p class="text-muted">Bạn chưa có địa chỉ nào</p>
                            <a th:href="@{/account/addresses/new(returnUrl='/orders/checkout')}" class="btn btn-outline-danger">
                                Thêm địa chỉ
                            </a>
                        </div>

                        <div th:each="addr, iter : ${addresses}"
                             class="d-flex justify-content-between align-items-start border rounded p-3 mb-2">

                            <div class="form-check flex-grow-1">
                                <input class="form-check-input addr-radio" type="radio" name="addressId"
                                       th:value="${addr.id}" th:id="'addr-' + ${addr.id}"
                                       th:checked="${addr.isDefault} or ${iter.first}"
                                       th:attr="data-lat=${addr.latitude != null ? addr.latitude : ''}, data-lng=${addr.longitude != null ? addr.longitude : ''}, data-label=${addr.tenNguoiNhan}">
                                <label class="form-check-label w-100" th:for="'addr-' + ${addr.id}">
                                    <strong th:text="${addr.tenNguoiNhan}"></strong>
                                    <span class="text-muted"> - </span>
                                    <span th:text="${addr.soDienThoai}"></span>
                                    <br>
                                    <span th:text="${addr.diaChiDayDu}"></span>
                                    <span th:if="${addr.isDefault}" class="badge bg-danger ms-2">Mặc định</span>
                                </label>
                            </div>

                            <div class="d-flex gap-2 ms-2 flex-shrink-0">
                                <a th:href="@{/account/addresses/{id}/edit(id=${addr.id},returnUrl='/orders/checkout')}"
                                   class="btn btn-sm btn-outline-secondary" title="Sửa địa chỉ">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger btn-delete-address"
                                        th:attr="data-id=${addr.id}" title="Xoá địa chỉ">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>

                        <a th:href="@{/account/addresses/new(returnUrl='/orders/checkout')}"
                           class="btn btn-sm btn-outline-secondary mt-2">
                            <i class="bi bi-plus-lg me-1"></i>Thêm địa chỉ mới
                        </a>

                        <!-- Bản đồ xem trước vị trí của địa chỉ đang được chọn -->
                        <div th:if="${!addresses.isEmpty()}" class="mt-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <small class="fw-bold text-muted">Vị trí trên bản đồ</small>
                                <small id="checkoutMapHint" class="text-muted"></small>
                            </div>
                            <div id="checkoutMap" style="width:100%; height:220px; border-radius:10px; overflow:hidden;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white fw-bold">Đơn hàng của bạn</div>
                    <div class="card-body">
                        <div th:each="item : ${items}" class="d-flex justify-content-between mb-2">
                            <span th:text="${item.variant.product.name} + ' x' + ${item.soLuong}"></span>
                            <span th:text="${#numbers.formatDecimal(item.thanhTien,0,'COMMA',0,'POINT')} + '₫'"></span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Tiền hàng</span>
                            <span th:text="${#numbers.formatDecimal(tongTienHang,0,'COMMA',0,'POINT')} + '₫'"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Phí vận chuyển</span>
                            <span>30.000₫</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Tổng cộng</span>
                            <span class="text-danger"
                                  th:text="${#numbers.formatDecimal(tongTienHang.add(new java.math.BigDecimal('30000')),0,'COMMA',0,'POINT')} + '₫'"></span>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 mt-3" th:disabled="${addresses.isEmpty()}">
                            Đặt hàng
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    document.querySelectorAll('.btn-delete-address').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!confirm('Xoá địa chỉ này?')) return;
            const id = btn.dataset.id;
            try {
                const res = await fetch(`/account/addresses/${id}/delete`, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                if (res.ok) {
                    window.location.reload();
                } else {
                    alert('Không thể xoá địa chỉ này. Vui lòng thử lại.');
                }
            } catch (e) {
                console.error('Xoá địa chỉ lỗi:', e);
                alert('Có lỗi xảy ra khi xoá địa chỉ.');
            }
        });
    });
</script>

<!-- Leaflet CSS/JS - miễn phí, không cần API key -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    /* =========================================================
       Bản đồ xem trước: tự động zoom tới vị trí của địa chỉ
       đang được chọn (radio) trong danh sách chọn địa chỉ giao hàng.
       ========================================================= */
    (function () {
        const mapEl = document.getElementById('checkoutMap');
        if (!mapEl) return; // không có địa chỉ nào -> không render bản đồ

        const defaultCenter = [21.028511, 105.804817]; // Hà Nội, dùng khi địa chỉ chưa có toạ độ
        const checkoutMap = L.map('checkoutMap').setView(defaultCenter, 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(checkoutMap);

        let checkoutMarker = null;
        const hintEl = document.getElementById('checkoutMapHint');

        function focusAddress(radio) {
            const lat = parseFloat(radio.dataset.lat);
            const lng = parseFloat(radio.dataset.lng);
            const label = radio.dataset.label || '';

            if (isNaN(lat) || isNaN(lng)) {
                // Địa chỉ cũ chưa có toạ độ (thêm trước khi có tính năng bản đồ)
                if (checkoutMarker) { checkoutMap.removeLayer(checkoutMarker); checkoutMarker = null; }
                checkoutMap.setView(defaultCenter, 13);
                if (hintEl) hintEl.textContent = 'Địa chỉ này chưa có toạ độ, hãy sửa lại để ghim vị trí.';
                return;
            }

            checkoutMap.setView([lat, lng], 16);
            if (checkoutMarker) {
                checkoutMarker.setLatLng([lat, lng]);
            } else {
                checkoutMarker = L.marker([lat, lng]).addTo(checkoutMap);
            }
            checkoutMarker.bindPopup(label).openPopup();
            if (hintEl) hintEl.textContent = '';
        }

        const radios = document.querySelectorAll('.addr-radio');
        radios.forEach(radio => {
            radio.addEventListener('change', () => focusAddress(radio));
        });

        // Zoom sẵn tới địa chỉ đang được chọn mặc định khi mở trang
        const checkedRadio = document.querySelector('.addr-radio:checked');
        if (checkedRadio) {
            setTimeout(() => {
                checkoutMap.invalidateSize();
                focusAddress(checkedRadio);
            }, 200);
        }
    })();
</script>
