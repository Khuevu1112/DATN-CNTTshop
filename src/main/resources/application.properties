spring.application.name=DuAnTotNghiep_CNTTShop

# ============================================================================
# BIẾN MÔI TRƯỜNG BẮT BUỘC — file này nằm trong git nên KHÔNG điền secret trực
# tiếp vào đây, mọi giá trị bí mật đọc từ biến môi trường.
#
#   DB_PASSWORD             mật khẩu SQL Server        (bắt buộc, app không chạy nếu thiếu)
#   JWT_SECRET              khoá ký JWT                (bắt buộc, app không chạy nếu thiếu)
#   MAIL_PASSWORD           app password Gmail         (thiếu thì không gửi được mail/OTP)
#   GOOGLE_CLIENT_ID        OAuth Google               (thiếu thì app KHÔNG khởi động được)
#   GOOGLE_CLIENT_SECRET    OAuth Google               (thiếu thì app KHÔNG khởi động được)
#   FACEBOOK_CLIENT_SECRET  OAuth Facebook             (thiếu thì app KHÔNG khởi động được)
#   STRIPE_SECRET_KEY       thanh toán thẻ             (thiếu thì chỉ thanh toán thẻ lỗi)
#   GHN_TOKEN               tracking GHN               (thiếu thì tra cứu tracking GHN lỗi)
#   VIETTELPOST_TOKEN       Viettel Post                (thiếu thì chưa tính được cước VTP)
#   AFTERSHIP_API_KEY       tracking Shopee Express     (thiếu thì tra cứu tracking SPX lỗi)
#
# Set trên Windows (PowerShell), nhớ MỞ LẠI terminal/IDE sau khi set:
#   [Environment]::SetEnvironmentVariable('DB_PASSWORD','<gia-tri>','User')
#
# Client ID của Facebook và publishable key của Stripe cố ý để nguyên trong file:
# chúng là giá trị công khai, lộ ra ở phía trình duyệt, không phải secret.
# ============================================================================

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ShopDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===== JWT =====
# KHÔNG đặt giá trị mặc định: chuỗi rỗng vẫn ký được token nhưng ai cũng giả mạo được, mà app
# lại chạy như bình thường nên không ai phát hiện. Thiếu biến thì để Spring chặn ngay lúc khởi
# động còn hơn.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===== Mail (OTP quên mật khẩu) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=cnttshop143@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# ===== VNPay (sandbox) =====
vnpay.tmnCode=HJAE21S7
vnpay.hashSecret=CN46RZ87Y91M0HVVF7W4RLN5TI5FARVR
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/payment/vnpay/return

# ===== Stripe (test mode) — điền secretKey/publishableKey/webhookSecret thật lấy từ
# dashboard.stripe.com sau khi tạo tài khoản (Developers > API keys, Webhooks). Để trống
# thì thanh toán thẻ sẽ báo lỗi khi gọi Stripe, nhưng COD/chuyển khoản vẫn hoạt động bình
# thường vì không phụ thuộc cấu hình này. =====
stripe.secretKey=${STRIPE_SECRET_KEY:}
stripe.publishableKey=pk_test_51ToxYcJIZWMjuOfwffwheLYi9VsYnru07mdxL9X8kF7HxUjfwts4dfNiGuglH8MAkNN2Tn0HQUXWKPowigRBioQv00pDhyBwmg
stripe.webhookSecret=
stripe.returnUrl=http://localhost:8080/payment/stripe/return

# ===== URL của Vue storefront (dùng để redirect sau khi thanh toán) =====
app.frontendUrl=http://localhost:5173

# ===== Upload file (ảnh sản phẩm, biên lai chuyển khoản, video đổi trả) =====
# Nâng lên 120MB/file để nhận được video minh chứng lỗi + video mở hàng (đổi trả). Một yêu cầu
# đổi trả có thể gồm 2 video + vài ảnh nên request tổng đặt rộng hơn (350MB).
spring.servlet.multipart.max-file-size=120MB
spring.servlet.multipart.max-request-size=350MB

# ===== Đăng nhập Google / Facebook (OAuth2) =====
# Google: lấy Client ID/Secret tại https://console.cloud.google.com/apis/credentials
# (Authorized redirect URI: http://localhost:8080/login/oauth2/code/google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Facebook: lấy App ID/Secret tại https://developers.facebook.com/apps
# (Valid OAuth Redirect URI: http://localhost:8080/login/oauth2/code/facebook)
spring.security.oauth2.client.registration.facebook.client-id=991051280213935
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v19.0/me?fields=id,name,email
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# ===== Vận chuyển: tracking GHN + Shopee Express (qua AfterShip) =====
# Để trống mọi token/api-key là AN TOÀN — mọi service tự fallback (trả Optional.empty()),
# không exception nào văng ra ngoài; chỉ mất tính năng tra cứu tracking thật.

# GHN — chỉ dùng để TRA CỨU chi tiết đơn (order_code), KHÔNG dùng để tính phí giao hàng.
ghn.token=${GHN_TOKEN:}
ghn.base-url=https://dev-online-gateway.ghn.vn
ghn.timeout-ms=5000

# Viettel Post — code tính cước real-time đã viết sẵn (ViettelPostApiService) nhưng CHƯA được
# gọi từ ShippingService: VTP dùng ID Tỉnh/Huyện/Xã riêng, chưa map với bảng PROVINCE/WARD hiện
# có (cần thêm cột vtp_province_id/vtp_ward_id + map 1 lần qua API danh mục của VTP trước).
viettelpost.token=${VIETTELPOST_TOKEN:}
viettelpost.base-url=https://partnerdev.viettelpost.vn
viettelpost.sender-province-id=
viettelpost.sender-district-id=
viettelpost.sender-ward-id=
viettelpost.default-service=VCN
viettelpost.timeout-ms=5000

# AfterShip — tracking cho Shopee Express (slug cố định "spx").
aftership.api-key=${AFTERSHIP_API_KEY:}
aftership.base-url=https://api.aftership.com/tracking/2024-04
aftership.timeout-ms=5000

