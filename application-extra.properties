# ============================================================
#  Bổ sung vào application.properties (nối tiếp phần ghtk.* đã có)
# ============================================================

# --- GHN (tracking, KHÔNG dùng để tính phí) ---
ghn.token=
ghn.base-url=https://dev-online-gateway.ghn.vn
ghn.timeout-ms=5000

# --- Viettel Post (tính phí — cần map ID địa chỉ trước, xem ghi chú trong code) ---
viettelpost.token=
viettelpost.base-url=https://partnerdev.viettelpost.vn
viettelpost.sender-province-id=
viettelpost.sender-district-id=
viettelpost.sender-ward-id=
viettelpost.default-service=VCN
viettelpost.timeout-ms=5000

# --- AfterShip (tracking Shopee Express) ---
aftership.api-key=
aftership.base-url=https://api.aftership.com/tracking/2024-04
aftership.timeout-ms=5000

# ============================================================
#  Tất cả để trống là AN TOÀN — mọi service tự fallback,
#  không có gì crash nếu chưa có key/token.
# ============================================================
